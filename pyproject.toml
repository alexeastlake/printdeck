[project]
name = "printdeck"
version = "0.1.0"
description = "A small local dashboard for Moonraker 3D printers (starting with a Creality K1C 2025)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "itsdangerous>=2.0",  # signed session cookies (Starlette SessionMiddleware)
    "httpx>=0.27",        # async requests to a printer's Moonraker HTTP API
    "python-multipart>=0.0.9",  # lets FastAPI parse the file-upload form
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# web/ is static assets, not a Python package — point setuptools at the backend.
packages = ["app"]
