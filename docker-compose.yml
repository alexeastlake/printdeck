# docker compose up -d --build
# Host-specific bits are env vars (see .env.example) so another stack can
# reuse this file unchanged.
services:
  printdeck:
    # CI publishes the same image to ghcr.io; drop `build:` to pull instead.
    image: ghcr.io/alexeastlake/printdeck:${PRINTDECK_IMAGE_TAG:-latest}
    build: .
    container_name: printdeck
    ports:
      - "${PRINTDECK_PORT:-8000}:8000"
    environment:
      # First-boot admin bootstrap only. Blank = no login.
      - PRINTDECK_ADMIN_USERNAME=${PRINTDECK_ADMIN_USERNAME:-}
      - PRINTDECK_ADMIN_PASSWORD=${PRINTDECK_ADMIN_PASSWORD:-}
      # Reverse proxy IP(s), so the login rate limit sees real clients.
      - FORWARDED_ALLOW_IPS=${PRINTDECK_FORWARDED_ALLOW_IPS:-127.0.0.1}
    # Directory mount, not file mounts: saves are atomic (temp + rename) and a
    # single-file bind mount pins the old inode. Created on first run. Runs
    # as uid 1000; if saves fail with EACCES, chown the directory.
    volumes:
      - ${PRINTDECK_DATA_DIR:-./data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
