# Copy to printers.yaml, or just add printers from the UI (it writes the
# file). printers.yaml is gitignored.

printers:
  - id: k1c                      # unique, url-safe
    name: "Creality K1C 2025"
    host: 192.168.1.50           # IPv4, IPv6, or hostname, no scheme/port
    moonraker_port: 7125
    api_key: null                # only if Moonraker's [authorization] needs one
    tls: false
    creality_light: true         # K1-series stock firmware: chamber light via port 9999
    camera_url: "http://192.168.1.50:8000/"   # null to hide
    group: "Home"                # optional; blank = "Ungrouped"

  # - id: ender
  #   name: "Ender 3 (Klipper)"
