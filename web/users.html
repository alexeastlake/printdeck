<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("printdeck-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  <title>PrintDeck — Users</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a6ea5'/%3E%3Crect x='8' y='9' width='16' height='3.2' rx='1.6' fill='white'/%3E%3Crect x='8' y='14.4' width='16' height='3.2' rx='1.6' fill='white'/%3E%3Crect x='8' y='19.8' width='16' height='3.2' rx='1.6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1><a href="/">PrintDeck</a></h1>
    <div class="header-actions">
      <div class="dropdown">
        <button id="settings-toggle" class="icon-btn" type="button"
                aria-haspopup="true" aria-expanded="false"
                title="Settings" aria-label="Settings">⚙</button>
      </div>
      <div class="dropdown">
        <button id="account-toggle" class="icon-btn account-toggle" type="button" hidden
                aria-haspopup="true" aria-expanded="false"
                title="Account" aria-label="Account"></button>
      </div>
    </div>
  </header>

  <main class="users-main">
    <h2 class="users-title">Users</h2>
    <p class="users-sub">Each account has a role, which decides what it can see and do — manage roles and their permissions on the <a href="/roles">Roles page</a>.</p>

    <form class="users-add" autocomplete="off">
      <label class="login-field users-field-name">
        <span>Username</span>
        <input class="add-username" type="text" autocomplete="off" required>
      </label>
      <label class="login-field users-field-password">
        <span>Password</span>
        <input class="add-password" type="password" autocomplete="off" minlength="8" required>
      </label>
      <label class="login-field users-field-role">
        <span>Role</span>
        <select class="add-role"></select>
      </label>
      <button type="submit" class="login-btn users-add-btn">Add user</button>
    </form>
    <p class="users-add-error login-error" role="alert" hidden></p>

    <div class="users-table">
      <div class="users-table-head">
        <span>Username</span>
        <span>Role</span>
        <span></span>
      </div>
      <ul class="users-list"></ul>
    </div>
    <p class="users-status" hidden></p>
  </main>

  <template id="user-row-template">
    <li class="user-row">
      <span class="user-name"></span>
      <select class="user-role-select"></select>
      <span class="user-actions">
        <button type="button" class="user-reset-password">Reset password</button>
        <button type="button" class="user-delete" title="Delete" aria-label="Delete">🗑</button>
      </span>
    </li>
  </template>

  <script src="/shared.js"></script>
  <script src="/users.js"></script>
</body>
</html>
