<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("printdeck-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  <title>PrintDeck — Roles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a6ea5'/%3E%3Crect x='8' y='9' width='16' height='3.2' rx='1.6' fill='white'/%3E%3Crect x='8' y='14.4' width='16' height='3.2' rx='1.6' fill='white'/%3E%3Crect x='8' y='19.8' width='16' height='3.2' rx='1.6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1><a href="/">PrintDeck</a></h1>
    <div class="header-actions">
      <div class="dropdown">
        <button id="settings-toggle" class="icon-btn" type="button"
                aria-haspopup="true" aria-expanded="false"
                title="Settings" aria-label="Settings">⚙</button>
      </div>
      <div class="dropdown">
        <button id="account-toggle" class="icon-btn account-toggle" type="button" hidden
                aria-haspopup="true" aria-expanded="false"
                title="Account" aria-label="Account"></button>
      </div>
    </div>
  </header>

  <main class="users-main">
    <h2 class="users-title">Roles</h2>
    <p class="users-sub">A role is a name plus a set of permissions — assign roles to accounts on the <a href="/users">Users page</a>. There's always at least one user who can manage users and roles; PrintDeck won't let you remove the last one.</p>

    <form class="roles-add" autocomplete="off">
      <label class="login-field roles-field-name">
        <span>Name</span>
        <input class="add-role-name" type="text" autocomplete="off" required>
      </label>
      <fieldset class="roles-permissions add-permissions">
        <legend>Permissions</legend>
      </fieldset>
      <button type="submit" class="login-btn roles-add-btn">Add role</button>
    </form>
    <p class="roles-add-error login-error" role="alert" hidden></p>

    <div class="users-table roles-table">
      <div class="users-table-head roles-table-head">
        <span>Name</span>
        <span>Permissions</span>
        <span></span>
      </div>
      <ul class="users-list roles-list"></ul>
    </div>
    <p class="users-status roles-status" hidden></p>
  </main>

  <template id="role-row-template">
    <li class="user-row role-row">
      <span class="role-name"></span>
      <span class="role-permissions"></span>
      <span class="user-actions">
        <button type="button" class="role-edit">Edit</button>
        <button type="button" class="user-delete role-delete" title="Delete" aria-label="Delete">🗑</button>
      </span>
    </li>
  </template>

  <script src="/shared.js"></script>
  <script src="/roles.js"></script>
</body>
</html>
