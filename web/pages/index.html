<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrintDeck</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Blocking: sets the theme before first paint. -->
  <script src="/static/theme-init.js"></script>
</head>
<body>
  <!-- Filled by shared.js mountTopbar(); data-* attributes pick the extras. -->
  <header class="topbar" data-conn data-add-printer></header>

  <main>
    <div class="toolbar">
      <input id="search" class="search-input" type="search" placeholder="Search printers…"
             aria-label="Search printers" autocomplete="off">
    </div>
    <div id="groups" aria-live="polite"></div>
    <p id="empty" class="empty" hidden>
      No printers configured yet.
    </p>
  </main>

  <template id="card-template">
    <article class="card">
      <header class="card-head">
        <h2><a class="name" href="#"></a></h2>
        <div class="head-right">
          <span class="badge"></span>
          <button class="edit-toggle" type="button" title="Edit printer settings"
                  aria-label="Edit printer settings">⚙</button>
        </div>
      </header>

      <form class="editor" hidden autocomplete="off">
        <p class="editor-title">Printer settings</p>
        <label class="editor-field">
          <span>Name</span>
          <input class="name-input" type="text" autocomplete="off"
                 placeholder="Creality K1C">
        </label>
        <label class="editor-field">
          <span>IP / hostname</span>
          <input class="host-input" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" placeholder="192.168.1.50">
        </label>
        <label class="editor-field">
          <span>Moonraker port</span>
          <input class="port-input" type="number" min="1" max="65535" step="1" inputmode="numeric"
                 autocomplete="off" placeholder="7125">
        </label>
        <label class="editor-field">
          <span>API key (optional)</span>
          <input class="api-key-input" type="password" autocomplete="off" spellcheck="false"
                 placeholder="Only if Moonraker requires one">
        </label>
        <label class="editor-field editor-field-check">
          <input class="tls-input" type="checkbox">
          <span>Connect over HTTPS/WSS</span>
        </label>
        <label class="editor-field editor-field-check">
          <input class="creality-light-input" type="checkbox">
          <span>Creality chamber light (K1 stock firmware, port 9999)</span>
        </label>
        <label class="editor-field">
          <span>Camera URL</span>
          <input class="camera-url-input" type="text" autocomplete="off"
                 spellcheck="false" placeholder="http://192.168.1.50:8000">
        </label>
        <label class="editor-field">
          <span>Group</span>
          <input class="group-input" type="text" autocomplete="off" placeholder="Garage">
        </label>
        <div class="editor-actions">
          <button type="submit" class="btn-save">Save</button>
          <button type="button" class="btn-cancel">Cancel</button>
          <button type="button" class="btn-delete-printer">Remove printer</button>
        </div>
        <p class="editor-error" role="alert" hidden></p>
      </form>

      <div class="temps">
        <div class="temp">
          <span class="temp-label">Nozzle</span>
          <span class="temp-value nozzle"></span>
        </div>
        <div class="temp">
          <span class="temp-label">Bed</span>
          <span class="temp-value bed"></span>
        </div>
      </div>

      <div class="job" hidden>
        <div class="job-top">
          <img class="job-thumb" alt="" hidden>
          <div class="job-info">
            <div class="progress"><div class="progress-bar"></div></div>
            <div class="job-meta">
              <span class="filename"></span>
              <span class="eta"></span>
            </div>
            <div class="job-actions">
              <button class="job-pause job-control" type="button" hidden>Pause</button>
              <button class="job-resume job-control" type="button" hidden>Resume</button>
              <button class="job-cancel job-control danger" type="button" hidden>Cancel</button>
              <span class="job-finished" hidden></span>
              <button class="job-dismiss" type="button" hidden>Dismiss</button>
            </div>
          </div>
        </div>
        <p class="job-error" role="alert" hidden></p>
      </div>

      <button class="cam-toggle" type="button" hidden>Show camera</button>
      <div class="camera" hidden>
        <video class="cam-frame" title="Printer camera. Click for fullscreen"
               muted autoplay playsinline></video>
        <p class="cam-status" role="status" hidden></p>
      </div>
    </article>
  </template>

  <template id="group-template">
    <details class="group" open>
      <summary class="group-summary">
        <span class="group-name"></span>
        <span class="group-count"></span>
      </summary>
      <div class="group-grid fleet"></div>
    </details>
  </template>

  <script src="/static/shared.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
